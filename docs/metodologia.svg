<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 252" width="832" height="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Metodologia da skill engenharia-de-prompt</title>
<desc id="d">Seis etapas em sequência: entender, diagnosticar, estruturar, projetar, testar e entregar. Lacuna bloqueante no diagnóstico interrompe o fluxo com até três perguntas fechadas. Falha em um dos dez testes devolve o rascunho à etapa de projeto.</desc>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<text x="4" y="18" font-size="12" fill="#59636e">Etapas 1 a 5 são internas · só a etapa 6 aparece na resposta</text>
<rect x="4" y="34" width="122" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<circle cx="22" cy="54" r="10" fill="#c15f3c"/>
<text x="22" y="58" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="38" y="59" font-size="13" font-weight="700" fill="#1f2328">Entender</text>
<text x="14" y="90" font-size="10.5" fill="#59636e">resultado observável</text>
<text x="14" y="107" font-size="10.5" fill="#59636e">consumidor e modo</text>
<text x="14" y="124" font-size="10.5" fill="#59636e">de uso · arquétipo</text>
<line x1="128" y1="90.0" x2="142" y2="90.0" stroke="#8c959f" stroke-width="1.4" marker-end="url(#s)"/>
<rect x="144" y="34" width="122" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<circle cx="162" cy="54" r="10" fill="#c15f3c"/>
<text x="162" y="58" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="178" y="59" font-size="13" font-weight="700" fill="#1f2328">Diagnosticar</text>
<text x="154" y="90" font-size="10.5" fill="#59636e">lacunas · ambiguidades</text>
<text x="154" y="107" font-size="10.5" fill="#59636e">premissas · alucinação</text>
<text x="154" y="124" font-size="10.5" fill="#59636e">conflitos · 9 vieses</text>
<line x1="268" y1="90.0" x2="282" y2="90.0" stroke="#8c959f" stroke-width="1.4" marker-end="url(#s)"/>
<rect x="284" y="34" width="122" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<circle cx="302" cy="54" r="10" fill="#c15f3c"/>
<text x="302" y="58" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="318" y="59" font-size="13" font-weight="700" fill="#1f2328">Estruturar</text>
<text x="294" y="90" font-size="10.5" fill="#59636e">9 blocos canônicos;</text>
<text x="294" y="107" font-size="10.5" fill="#59636e">só entra o bloco</text>
<text x="294" y="124" font-size="10.5" fill="#59636e">que muda a saída</text>
<line x1="408" y1="90.0" x2="422" y2="90.0" stroke="#8c959f" stroke-width="1.4" marker-end="url(#s)"/>
<rect x="424" y="34" width="122" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<circle cx="442" cy="54" r="10" fill="#c15f3c"/>
<text x="442" y="58" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="458" y="59" font-size="13" font-weight="700" fill="#1f2328">Projetar</text>
<text x="434" y="90" font-size="10.5" fill="#59636e">7 arquiteturas, do</text>
<text x="434" y="107" font-size="10.5" fill="#59636e">direto ao agêntico,</text>
<text x="434" y="124" font-size="10.5" fill="#59636e">calibradas por modelo</text>
<line x1="548" y1="90.0" x2="562" y2="90.0" stroke="#8c959f" stroke-width="1.4" marker-end="url(#s)"/>
<rect x="564" y="34" width="122" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<circle cx="582" cy="54" r="10" fill="#c15f3c"/>
<text x="582" y="58" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="598" y="59" font-size="13" font-weight="700" fill="#1f2328">Testar</text>
<text x="574" y="90" font-size="10.5" fill="#59636e">10 testes de</text>
<text x="574" y="107" font-size="10.5" fill="#59636e">robustez; falhou em</text>
<text x="574" y="124" font-size="10.5" fill="#59636e">um, reescreve</text>
<line x1="688" y1="90.0" x2="702" y2="90.0" stroke="#8c959f" stroke-width="1.4" marker-end="url(#s)"/>
<rect x="704" y="34" width="122" height="112" rx="10" fill="#fbeee8" stroke="#c15f3c" stroke-width="1.2"/>
<circle cx="722" cy="54" r="10" fill="#c15f3c"/>
<text x="722" y="58" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="738" y="59" font-size="13" font-weight="700" fill="#1f2328">Entregar</text>
<text x="714" y="90" font-size="10.5" fill="#59636e">diagnóstico</text>
<text x="714" y="107" font-size="10.5" fill="#59636e">prompt final</text>
<text x="714" y="124" font-size="10.5" fill="#59636e">premissas · ajustes</text>
<line x1="205.0" y1="146" x2="205.0" y2="180" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#s)"/>
<rect x="109.0" y="184" width="250" height="44" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="121.0" y="202" font-size="11" font-weight="600" fill="#1f2328">Lacuna bloqueante?</text>
<text x="121.0" y="218" font-size="10.5" fill="#59636e">até 3 perguntas fechadas, e o fluxo para</text>
<path d="M625.0 146 V176 H485.0 V152" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#s)"/>
<text x="555.0" y="192" font-size="10.5" fill="#59636e" text-anchor="middle">falhou em um teste: reescreve</text>
</svg>
